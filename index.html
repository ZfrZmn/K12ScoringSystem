<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Scoring System - Kuliah 12 🚀</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #121824;
            --neon-t1: #ff007f; /* Neon Pink */
            --neon-t2: #00ff66; /* Neon Green */
            --neon-t3: #ff3333; /* Neon Red */
            --neon-t4: #ff9900; /* Neon Orange */
            --neon-t5: #00ffff; /* Neon Cyan */
            --neon-t6: #9933ff; /* Neon Purple */
            --neon-t7: #ffff00; /* Neon Yellow */
            --neon-t8: #ffffff; /* Neon White */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a233a 0%, var(--bg-dark) 80%);
            margin: 0;
            padding: 20px;
            color: #f0f4f8;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.2);
            margin-bottom: 30px;
        }

        /* Scoreboard Grid */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            background: rgba(18, 24, 36, 0.7);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .team-score-card {
            text-align: center;
            padding: 20px 10px;
            border-radius: 12px;
            font-weight: bold;
            background: #161f30;
            border: 2px solid transparent;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .team-score-card h3 {
            margin: 0 0 10px 0;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8fa0dd;
        }

        .team-score-card .score {
            font-size: 2.5rem;
            margin: 0;
            font-family: monospace;
            font-weight: 700;
        }

        /* Glow themes for teams */
        .t1 { border-color: var(--neon-t1); box-shadow: 0 0 15px rgba(255, 0, 127, 0.2), inset 0 0 15px rgba(255, 0, 127, 0.1); }
        .t1 .score { color: var(--neon-t1); text-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }
        
        .t2 { border-color: var(--neon-t2); box-shadow: 0 0 15px rgba(0, 255, 102, 0.2), inset 0 0 15px rgba(0, 255, 102, 0.1); }
        .t2 .score { color: var(--neon-t2); text-shadow: 0 0 10px rgba(0, 255, 102, 0.5); }

        .t3 { border-color: var(--neon-t3); box-shadow: 0 0 15px rgba(255, 51, 51, 0.2), inset 0 0 15px rgba(255, 51, 51, 0.1); }
        .t3 .score { color: var(--neon-t3); text-shadow: 0 0 10px rgba(255, 51, 51, 0.5); }

        .t4 { border-color: var(--neon-t4); box-shadow: 0 0 15px rgba(255, 153, 0, 0.2), inset 0 0 15px rgba(255, 153, 0, 0.1); }
        .t4 .score { color: var(--neon-t4); text-shadow: 0 0 10px rgba(255, 153, 0, 0.5); }

        .t5 { border-color: var(--neon-t5); box-shadow: 0 0 15px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(0, 255, 255, 0.1); }
        .t5 .score { color: var(--neon-t5); text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); }

        .t6 { border-color: var(--neon-purple); border-color: var(--neon-t6); box-shadow: 0 0 15px rgba(153, 51, 255, 0.2), inset 0 0 15px rgba(153, 51, 255, 0.1); }
        .t6 .score { color: var(--neon-t6); text-shadow: 0 0 10px rgba(153, 51, 255, 0.5); }

        .t7 { border-color: var(--neon-t7); box-shadow: 0 0 15px rgba(2ffff, 0, 0.2), inset 0 0 15px rgba(255, 255, 0, 0.1); }
        .t7 .score { color: var(--neon-t7); text-shadow: 0 0 10px rgba(255, 255, 0, 0.5); }

        .t8 { border-color: var(--neon-t8); box-shadow: 0 0 15px rgba(255, 255, 255, 0.1), inset 0 0 15px rgba(255, 255, 255, 0.05); }
        .t8 .score { color: var(--neon-t8); text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }

        /* Scoring Flash Animation */
        @keyframes flash-bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); filter: brightness(1.5); }
            100% { transform: scale(1); }
        }
        .bump { animation: flash-bump 0.4s ease-out; }

        /* Action Panel */
        .action-panel {
            text-align: right;
            margin-bottom: 25px;
        }
        .btn-reset {
            background-color: transparent;
            color: #ff3333;
            border: 2px solid #ff3333;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.2);
        }
        .btn-reset:hover {
            background-color: #ff3333;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.6);
            transform: translateY(-2px);
        }

        /* Buttons Section */
        .grid-title {
            color: #a5b4fc;
            border-bottom: 1px dashed rgba(165, 180, 252, 0.3);
            padding-bottom: 12px;
            margin-bottom: 25px;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }

        .student-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .student-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: transparent;
            transition: background-color 0.25s;
        }

        .student-name {
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .team-badge {
            align-self: flex-start;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
            border: 1px solid transparent;
        }

        /* Interactive Dynamic Hover styles matching individual teams */
        .student-btn[data-team="1"]:hover { border-color: var(--neon-t1); box-shadow: 0 0 15px rgba(255, 0, 127, 0.25); transform: translateY(-3px); }
        .student-btn[data-team="1"]::before { background: var(--neon-t1); }
        .student-btn[data-team="1"]:hover .team-badge { color: var(--neon-t1); border-color: var(--neon-t1); background: rgba(255,0,127,0.1); }

        .student-btn[data-team="2"]:hover { border-color: var(--neon-t2); box-shadow: 0 0 15px rgba(0, 255, 102, 0.25); transform: translateY(-3px); }
        .student-btn[data-team="2"]::before { background: var(--neon-t2); }
        .student-btn[data-team="2"]:hover .team-badge { color: var(--neon-t2); border-color: var(--neon-t2); background: rgba(0,255,102,0.1); }

        .student-btn[data-team="3"]:hover { border-color: var(--neon-t3); box-shadow: 0 0 15px rgba(255, 51, 51, 0.25); transform: translateY(-3px); }
        .student-btn[data-team="3"]::before { background: var(--neon-t3); }
        .student-btn[data-team="3"]:hover .team-badge { color: var(--neon-t3); border-color: var(--neon-t3); background: rgba(255,51,51,0.1); }

        .student-btn[data-team="4"]:hover { border-color: var(--neon-t4); box-shadow: 0 0 15px rgba(255, 153, 0, 0.25); transform: translateY(-3px); }
        .student-btn[data-team="4"]::before { background: var(--neon-t4); }
        .student-btn[data-team="4"]:hover .team-badge { color: var(--neon-t4); border-color: var(--neon-t4); background: rgba(255,153,0,0.1); }

        .student-btn[data-team="5"]:hover { border-color: var(--neon-t5); box-shadow: 0 0 15px rgba(0, 255, 255, 0.25); transform: translateY(-3px); }
        .student-btn[data-team="5"]::before { background: var(--neon-t5); }
        .student-btn[data-team="5"]:hover .team-badge { color: var(--neon-t5); border-color: var(--neon-t5); background: rgba(0,255,255,0.1); }

        .student-btn[data-team="6"]:hover { border-color: var(--neon-t6); box-shadow: 0 0 15px rgba(153, 51, 255, 0.25); transform: translateY(-3px); }
        .student-btn[data-team="6"]::before { background: var(--neon-t6); }
        .student-btn[data-team="6"]:hover .team-badge { color: var(--neon-t6); border-color: var(--neon-t6); background: rgba(153,51,255,0.1); }

        .student-btn[data-team="7"]:hover { border-color: var(--neon-t7); box-shadow: 0 0 15px rgba(255, 255, 0, 0.25); transform: translateY(-3px); }
        .student-btn[data-team="7"]::before { background: var(--neon-t7); }
