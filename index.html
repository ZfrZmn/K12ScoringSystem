<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Ultimate Team Scoring System ✨</title>
    <style>
        body {
            font-family: 'Poppins', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            margin: 0;
            padding: 30px;
            color: #f8fafc;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            font-size: 2.8rem;
            background: linear-gradient(45deg, #38bdf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            font-weight: 800;
            letter-spacing: -0.5px;
            filter: drop-shadow(0 2px 8px rgba(192, 132, 252, 0.2));
        }
        .credit-link {
            display: block;
            text-align: center;
            margin-bottom: 35px;
            font-style: italic;
            color: #94a3b8;
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .credit-link:hover {
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* Scoreboard Grid */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            padding: 10px;
        }
        .team-score-card {
            text-align: center;
            padding: 20px 15px;
            border-radius: 16px;
            font-weight: bold;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .team-score-card:hover {
            transform: translateY(-8px) scale(1.03);
        }
        .team-score-card h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.9;
        }
        .team-score-card .score {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Neon Theming Map */
        .t1 { background: linear-gradient(135deg, #6b21a8, #d8b4fe); color: #ffffff !important; box-shadow: 0 0 15px rgba(216, 180, 254, 0.3); }
        .t2 { background: linear-gradient(135deg, #065f46, #6ee7b7); color: #ffffff !important; box-shadow: 0 0 15px rgba(110, 231, 183, 0.3); }
        .t3 { background: linear-gradient(135deg, #991b1b, #fca5a5); color: #ffffff !important; box-shadow: 0 0 15px rgba(252, 165, 165, 0.3); }
        .t4 { background: linear-gradient(135deg, #9a3412, #fed7aa); color: #ffffff !important; box-shadow: 0 0 15px rgba(254, 215, 170, 0.3); }
        .t5 { background: linear-gradient(135deg, #1e40af, #93c5fd); color: #ffffff !important; box-shadow: 0 0 15px rgba(147, 197, 253, 0.3); }
        .t6 { background: linear-gradient(135deg, #374151, #d1d5db); color: #ffffff !important; box-shadow: 0 0 15px rgba(209, 213, 219, 0.3); }
        .t7 { background: linear-gradient(135deg, #854d0e, #fde047); color: #ffffff !important; box-shadow: 0 0 15px rgba(253, 224, 71, 0.3); }
        .t8 { background: linear-gradient(135deg, #1f2937, #9ca3af); color: #ffffff !important; box-shadow: 0 0 15px rgba(156, 163, 175, 0.3); }

        /* Mode and Control Panel */
        .action-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .mode-toggle-group {
            display: flex;
            gap: 15px;
        }
        .mode-label {
            cursor: pointer;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid transparent;
        }
        .mode-label:has(input[value="add"]:checked) {
            background: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            color: #34d399;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
        .mode-label:has(input[value="subtract"]:checked) {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #f87171;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }
        .mode-label input {
            display: none;
        }
        .btn-reset {
            background: linear-gradient(135deg, #dc2626, #f87171);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.2);
            transition: all 0.3s ease;
        }
        .btn-reset:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        /* Leaderboard styling */
        .grid-title {
            color: #f1f5f9;
            font-size: 1.6rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ranking-container {
            background: rgba(255, 255, 255, 0.02);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .ranking-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            text-align: left;
        }
        .ranking-table th {
            padding: 12px 20px;
            color: #94a3b8;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(255,255,255,0.05);
        }
        .ranking-row {
            background: rgba(255,255,255,0.03);
            transition: all 0.3s ease;
        }
        .ranking-row:hover {
            background: rgba(255,255,255,0.07);
            transform: scale(1.01);
        }
        .ranking-row td {
            padding: 15px 20px;
            font-weight: 600;
        }
        .ranking-row td:first-child {
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }
        .ranking-row td:last-child {
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        /* Student Grid */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .student-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .student-btn:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        body.add-mode .student-btn:hover { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        body.subtract-mode .student-btn:hover { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }

        .student-btn .team-badge {
            align-self: flex-start;
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 20px;
            margin-top: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
